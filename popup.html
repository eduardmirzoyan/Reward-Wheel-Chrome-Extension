<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Reward Wheel</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body>
  <main class="main">
    <section class="top-section">
      <header class="header">
        <div class="brand-icon">✦</div>
        <div>
          <p class="sub-title">MY POOKIES</p>
          <p class="title">Reward Wheel</p>
        </div>
        <div class="balance">
          <p class="sub-title">BALANCE</p>
          <strong id="balance">$0.00</strong>
        </div>
      </header>
    </section>

    <section class="middle-section">
      <div id="feedback" class="feedback">
        <span id="feedback-kaomoji"></span>
        <span id="feedback-message"></span>
      </div>
      <div class="wheel-section">
        <div class="wheel-frame">
          <div class="pointer"></div>
          <svg id="wheel" class="wheel" viewBox="0 0 300 300"></svg>
          <div class="wheel-center"></div>
        </div>
      </div>
    </section>

    <section class="bottom-section">
      <div class="spin-controls">
        <button id="spin-button" class="spin-button" type="button" disabled>
          <span>Spin Wheel</span>
        </button>
        <input id="spin-input" class="spin-input" type="number" min="1" step="1" value="1">
        <span class="spin-count-label">time(s).</span>
      </div>
      <button id="reset-button" class="reset-button" type="button">Reset balance</button>
      <p id="status" class="status"></p>
    </section>
  </main>
</body>

</html>
