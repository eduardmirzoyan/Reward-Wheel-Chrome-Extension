<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Reward Wheel</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body>
  <main class="app">
    <section class="top-section">
      <header class="header">
        <div class="brand-icon">✦</div>
        <div>
          <p class="sub-title">MY POOKIES</p>
          <p class="title">Reward Wheel</p>
        </div>
        <div class="balance">
          <p class="sub-title">BALANCE</p>
          <strong id="balance">$0.00</strong>
        </div>
      </header>
    </section>

    <section class="middle-section">
      <div id="feedback" class="feedback">
        <span id="feedback-kaomoji">(-_-) zZ</span>
        <span id="feedback-message"></span>
      </div>
      <div class="wheel-section">
        <div class="wheel-frame">
          <div class="pointer"></div>
          <svg id="wheel" class="wheel" viewBox="0 0 300 300"></svg>
          <div class="wheel-center"></div>
        </div>
      </div>
    </section>

    <section class="bottom-section">
      <button id="spin-button" class="spin-button" type="button" disabled>
        <span>Spin the Wheel</span>
      </button>
      <button id="reset-button" class="reset-button" type="button">Reset balance</button>
      <p id="status" class="status"></p>
    </section>
  </main>
</body>

</html>
